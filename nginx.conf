server {
    listen 80;
    root /usr/share/nginx/html;
    # Redirecciones relativas: detrás de Cloudflare el contenedor sólo ve http,
    # y una absoluta (/cara -> http://…/cara/) haría perder el https que exige la cámara
    absolute_redirect off;
    location / {
        try_files $uri $uri/ =404;
        # que el navegador pregunte siempre si hay versión nueva: sin esto, un móvil
        # que ya la había abierto seguía mostrando la página vieja durante horas
        add_header Cache-Control "no-cache";
    }
}
